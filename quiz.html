<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クイズモード - 駅名クイズ</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>

  <div class="common-header" onclick="location.href='index.html'">🚉 駅名クイズ</div>
  <h1>❓ クイズモード</h1>

  <!-- セットアップセクション -->
  <div id="setupSection">

    <div id="filterContainer"></div>

    <div class="setup-panel">
      <h3>📝 出題設定</h3>

      <div class="setup-group">
        <label>出題形式</label>
        <div class="radio-group">
          <label><input type="radio" name="quizType" value="pref_select" checked> 駅名 → 都道府県（選択式）</label>
          <label><input type="radio" name="quizType" value="pref_text"> 駅名 → 都道府県（記入式）</label>
          <label><input type="radio" name="quizType" value="line"> 駅名 → 路線（選択式）</label>
          <label><input type="radio" name="quizType" value="company"> 駅名 → 鉄道会社（選択式）</label>
        </div>
      </div>

      <div class="setup-group">
        <label>出題数</label>
        <div class="radio-group">
          <label><input type="radio" name="questionCount" value="10" checked> 10問</label>
          <label><input type="radio" name="questionCount" value="50"> 50問</label>
          <label><input type="radio" name="questionCount" value="100"> 100問</label>
          <label><input type="radio" name="questionCount" value="0"> 無限</label>
        </div>
      </div>

      <button id="startQuizButton" class="primary start-button">スタート</button>
    </div>

  </div>

  <!-- クイズセクション -->
  <div id="quizSection" style="display:none;">

    <div class="quiz-progress">
      <span id="quizProgress"></span>
      <span id="quizScore"></span>
    </div>

    <div class="quiz-question">
      <div class="quiz-station-name" id="quizStationName"></div>
      <div class="quiz-prompt" id="quizPrompt"></div>
    </div>

    <div id="choicesArea"></div>

    <div id="quizFeedback" class="quiz-feedback" style="display:none;">
      <div class="quiz-feedback-text" id="quizFeedbackText"></div>
      <div class="official-name" id="officialNameText" style="font-size: 0.9rem; color: var(--text); margin-bottom: 8px;"></div>
      <div class="correct-answer" id="correctAnswerText" style="display:none;"></div>
      <button id="nextButton" class="primary">次の問題</button>
    </div>

  </div>

  <!-- リザルトセクション -->
  <div id="quizResult" style="display:none;">

    <div class="result">
      <h2 id="quizResultTitle"></h2>
      <p id="quizResultSummary"></p>
      <a href="index.html" class="result-link">トップへ戻る</a>
      <button class="retryButton" onclick="location.reload()">再挑戦</button>
    </div>

    <section class="card-section" style="margin-top:16px;">
      <h3>結果一覧</h3>
      <ul id="quizReviewList" class="quiz-review-list"></ul>
    </section>

  </div>

  <script src="js/data.js"></script>
  <script src="js/quiz.js"></script>

</body>

</html>
